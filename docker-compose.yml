version: '3.8'

services:
  orchestrator:
    build: ./orchestrator
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-data:/data
    environment:
      - DATABASE_URL=sqlite:///./data/platform.db
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    restart: unless-stopped
    networks:
      - agent-net

  web:
    build: ./web
    ports:
      - "3000:3000"
    depends_on:
      - orchestrator
    restart: unless-stopped
    networks:
      - agent-net

  agent-example:
    build: ./agent-base
    ports:
      - "6080:6080"
    volumes:
      - workspace:/workspace
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    networks:
      - agent-net
    profiles:
      - example

volumes:
  agent-data:
  # pinned name (no compose project prefix) so UI-created agent containers,
  # which bind "ai-agent-platform-workspace" via the Docker API, share the same
  # /workspace repo working tree as agent-example
  workspace:
    name: ai-agent-platform-workspace

networks:
  agent-net:
    driver: bridge
